<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Our Story — A cinematic editorial chronicle of two lives intertwined. A private archive of moments, memory, and love." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:title" content="Our Story" />
  <meta property="og:description" content="A cinematic editorial chronicle of two lives intertwined." />
  <meta property="og:type" content="website" />

  <title>Our Story</title>

  <!-- Playfair Display (headers/numerals) + Inter (body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Inter:wght@200;300;400&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- Lenis — smooth scroll inertia -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.3/dist/lenis.min.js"></script>
  <!-- GSAP core + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════
       CINEMATIC LOADER — black screen with today's date
  ═══════════════════════════════════════════════════════ -->
  <div id="loader" aria-hidden="true" role="presentation">
    <div class="loader__inner">
      <p class="loader__date" id="loader-date"></p>
      <div class="loader__rule" aria-hidden="true"></div>
      <p class="loader__sub">Our Story</p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       FILM GRAIN — canvas overlay, animated by motion.js
  ═══════════════════════════════════════════════════════ -->
  <canvas id="film-grain-canvas" aria-hidden="true"></canvas>

  <!-- ═══════════════════════════════════════════════════════
       CUSTOM CURSOR
  ═══════════════════════════════════════════════════════ -->
  <div id="custom-cursor" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════════════════
       STATUS BAR — fixed bottom, live heartbeat counter
  ═══════════════════════════════════════════════════════ -->
  <div id="status-bar" aria-label="Relationship status metadata">
    <div class="status-bar__inner">
      <span class="status-bar__label">EST. XIV JAN MMXXIII</span>
      <div class="status-bar__center">
        <span class="status-bar__timecode" id="timecode-display" aria-live="off">000:00:00:00</span>
      </div>
      <span class="status-bar__label">OUR STORY — ONGOING</span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       HEADER — Fixed Navigation
  ═══════════════════════════════════════════════════════ -->
  <header id="site-header" role="banner">
    <div class="header__inner">

      <a href="#hero" class="header__logo" aria-label="Our Story — Return to top">
        <span>Our</span> Story
      </a>

      <nav role="navigation" aria-label="Primary navigation">
        <ul class="header__nav">
          <li><a href="#featured" id="nav-featured">Featured</a></li>
          <li><a href="#archive" id="nav-archive">Archive</a></li>
        </ul>
      </nav>

    </div>
  </header>


  <!-- ═══════════════════════════════════════════════════════
       HERO — Full-Screen Cinematic Opening
  ═══════════════════════════════════════════════════════ -->
  <section id="hero" aria-label="Hero">

    <img src="assets/images/06-14-2026/IMG_8219.jpg"
      alt="A cinematic silhouette of two people in a vast, dimly lit space" class="hero__bg" loading="eager"
      fetchpriority="high" />

    <div class="hero__vignette" aria-hidden="true"></div>

    <div class="hero__content container">

      <div class="hero__eyebrow">
        <span class="rule--accent"></span>
        <span class="t-subheading">A Private Archive</span>
      </div>

      <div class="hero__title-block">
        <h1>
          <span class="hero__title-line t-display">
            <span>Our</span>
          </span>
          <span class="hero__title-line t-display--italic">
            <span>Story</span>
          </span>
        </h1>
      </div>

      <div class="hero__meta">
        <p class="t-caption">Est. 2023</p>
        <div class="hero__meta-divider" aria-hidden="true"></div>
        <p class="t-caption">Ongoing</p>
        <div class="hero__meta-divider" aria-hidden="true"></div>
        <p class="t-caption">A Chronicle of Two</p>
      </div>

    </div>

    <div class="hero__scroll" aria-hidden="true">
      <span class="t-caption" style="writing-mode: vertical-rl; letter-spacing: 0.2em;">Scroll</span>
      <div class="hero__scroll-line"></div>
    </div>

  </section>


  <!-- ═══════════════════════════════════════════════════════
       FEATURED — Horizontal Chapter Spreads
       #horizontal-track is translated by GSAP (motion.js)
  ═══════════════════════════════════════════════════════ -->
  <section id="featured" aria-label="Featured moments">

    <div id="horizontal-track">
      <!-- chapters.js renders slide articles here -->
      <div id="featured-chapters" aria-label="Relationship chapters"></div>
    </div>

    <!-- Horizontal progress line at bottom of section -->
    <div class="featured-progress" aria-hidden="true">
      <div class="featured-progress__bar" id="progress-bar"></div>
    </div>

  </section>


  <!-- ═══════════════════════════════════════════════════════
       ARCHIVE — placeholder
  ═══════════════════════════════════════════════════════ -->
  <section id="archive" aria-label="Archive">
    <div class="container">
      <div class="section-label reveal">
        <span class="rule--accent"></span>
        <span class="t-subheading">Archive</span>
      </div>
    </div>
  </section>


  <!-- ═══════════════════════════════════════════════════════
       SOUND-WAVE VISUALIZER — Mute / Unmute toggle
  ═══════════════════════════════════════════════════════ -->
  <button id="sound-toggle" aria-label="Toggle ambient audio" aria-pressed="false">
    <span class="sound-bar sound-bar--1" aria-hidden="true"></span>
    <span class="sound-bar sound-bar--2" aria-hidden="true"></span>
    <span class="sound-bar sound-bar--3" aria-hidden="true"></span>
    <span class="sound-bar sound-bar--4" aria-hidden="true"></span>
    <span class="sound-bar sound-bar--5" aria-hidden="true"></span>
    <span class="sound-toggle__tip" aria-hidden="true">Ambient audio on</span>
  </button>


  <!-- ═══════════════════════════════════════════════════════
       SCRIPTS — load order matters
  ═══════════════════════════════════════════════════════ -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/data/chapters.js"></script>
  <script src="assets/js/chapters.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/audio.js"></script>

</body>

</html>
